[package]
name = "dmto-relay"
version = "0.0.1"
edition = "2024"

[dependencies]
dmto-ecash = { path = "../dmto-ecash" }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "migrate"] }
secp256k1 = { version = "0.29", features = ["rand"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
serde_json = "1"
