[package]
name = "dmto-cli"
version = "0.0.1"
edition = "2024"

[dependencies]
dmto-ecash = { path = "../dmto-ecash" }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"

[dev-dependencies]
secp256k1 = "0.29"
